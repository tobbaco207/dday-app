<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 디데이</title>
<style>
body{font-family:system-ui;background:#f5f6fa;margin:0;padding:24px;color:#222}
h1{text-align:center}
.panel{background:white;padding:20px;border-radius:18px;box-shadow:0 4px 15px #0001}
input,button{box-sizing:border-box;width:100%;padding:14px;margin:7px 0;border-radius:10px;font-size:16px}
input{border:1px solid #ddd}
button{background:#5268e8;color:white;border:0}
.item{background:white;margin-top:14px;padding:18px;border-radius:14px}
.days{font-size:28px;font-weight:bold;color:#5268e8}
.delete{background:#eee;color:#444}
</style>
</head>
<body>
<h1>📅 나의 디데이</h1>
<div class="panel">
<input id="name" placeholder="기념일 이름" maxlength="50">
<input id="date" type="date">
<button onclick="add()">디데이 추가</button>
</div>
<div id="list"></div>
<script>
let events=JSON.parse(localStorage.getItem('ddays')||'[]');
function save(){localStorage.setItem('ddays',JSON.stringify(events))}
function dayDiff(date){
const now=new Date();
const today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
const parts=date.split('-').map(Number);
return Math.round((Date.UTC(parts[0],parts[1]-1,parts[2])-today)/86400000);
}
function add(){
const name=document.getElementById('name').value.trim();
const date=document.getElementById('date').value;
if(!name||!date){alert('이름과 날짜를 입력해 주세요');return}
events.push({name,date});save();render();
document.getElementById('name').value='';
document.getElementById('date').value='';
}
function removeEvent(i){
if(confirm('삭제할까요?')){events.splice(i,1);save();render()}
}
function render(){
const list=document.getElementById('list');
list.replaceChildren();
events.forEach((e,i)=>{
const d=dayDiff(e.date);
const item=document.createElement('div');item.className='item';
const name=document.createElement('div');name.textContent=e.name;
const date=document.createElement('div');date.textContent=e.date;
const days=document.createElement('div');days.className='days';
days.textContent=d===0?'D-Day':d>0?'D-'+d:'D+'+Math.abs(d);
const btn=document.createElement('button');btn.className='delete';
btn.textContent='삭제';btn.onclick=()=>removeEvent(i);
item.append(name,date,days,btn);list.append(item);
});
}
render();
</script>
</body>
</html>
